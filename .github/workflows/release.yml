name: Release Coral & Coral Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v2.8.3)"
        required: false
        default: "v2.8.3"

permissions:
  contents: write

jobs:
  verify-runtime:
    name: Verify Rust OCI & CRI E2E Suite (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: x86_64
          - platform: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: coral_repo
      - name: Allow unprivileged user namespaces on Ubuntu 24.04 runners
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run full Coral verify.sh gate
        working-directory: coral_repo
        run: ./verify.sh
      - name: Report host architecture
        run: uname -m

  package-linux-runtime:
    name: Package Linux Runtime (${{ matrix.arch }})
    needs: verify-runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: x86_64
          - platform: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: coral_repo
      - name: Determine release version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ inputs.version || 'v2.8.3' }}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build .deb and .tar.gz bundles
        working-directory: coral_repo
        run: |
          chmod +x scripts/package-deb.sh
          ./scripts/package-deb.sh "${{ steps.ver.outputs.num }}"
          mkdir -p dist/coral/scripts
          install -m 0755 target/release/coral dist/coral/coral
          install -m 0755 target/release/coral-daemon dist/coral/coral-daemon
          install -m 0755 install.sh dist/coral/install.sh
          install -m 0755 scripts/setup-rootfs.sh dist/coral/scripts/setup-rootfs.sh
          tar -C dist -czf "target/packages/coral-${{ steps.ver.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz" coral
      - name: Verify the packaged runtime
        working-directory: coral_repo
        run: |
          set -euo pipefail
          echo "built arch: $(dpkg --print-architecture)"
          ls -lh target/packages/
          dpkg-deb --info target/packages/coral-runtime_*.deb | head -12
          dpkg-deb --contents target/packages/coral-runtime_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: coral-runtime-linux-${{ matrix.arch }}
          path: coral_repo/target/packages/*

  package-desktop:
    name: Package Coral Desktop (${{ matrix.target }})
    needs: verify-runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
          - platform: windows-latest
            target: windows
          - platform: macos-latest
            target: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            coral_repo
            desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        working-directory: desktop
        run: npm ci
      - name: Build Coral Desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --verbose
      - name: Collect flat Linux installers
        if: matrix.target == 'linux'
        run: |
          mkdir -p desktop-dist
          find desktop/src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} desktop-dist/ \;
          ls -lh desktop-dist/
      - name: Collect flat Windows installers
        if: matrix.target == 'windows'
        shell: bash
        run: |
          mkdir -p desktop-dist
          find desktop/src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} desktop-dist/ \;
          ls -lh desktop-dist/
      - name: Collect flat macOS installers (.dmg)
        if: matrix.target == 'macos'
        run: |
          mkdir -p desktop-dist
          find desktop/src-tauri/target/release/bundle -maxdepth 2 -type f \
            -name '*.dmg' \
            -exec cp {} desktop-dist/ \;
          ls -lh desktop-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: coral-desktop-${{ matrix.target }}
          path: desktop-dist/*

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-linux-runtime, package-desktop]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate unified SHA256SUMS.txt
        working-directory: release-assets
        run: |
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
