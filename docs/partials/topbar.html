<body>
  <div id="scroll-progress" aria-hidden="true"></div>
  <div class="announce-bar">
    <div class="announce-inner">
      <span class="announce-pill" data-i18n="announce.pill">NEW</span>
      <span data-i18n="announce.text">Coral v2.9.0 — Enterprise Security Hardening (Default-Deny Seccomp, Landlock LSM, Masked Paths &amp; CIS Audit)</span>
      <a class="announce-link" href="#install" data-i18n="announce.cta">ติดตั้งเลย →</a>
    </div>
  </div>

  <header class="site-header" id="site-header">
    <div class="header-inner" id="header-inner">
      <a class="brand-link" href="#overview">
        <img class="brand-icon" src="assets/coral-icon.png" alt="Coral Logo" width="34" height="34">
        <span>Coral</span>
        <span class="version-pill" id="topbar-version">v2.9.0</span>
      </a>

      <nav class="site-nav" aria-label="Primary">
        <button
          class="menu-button"
          type="button"
          popovertarget="site-menu"
          popovertargetaction="toggle"
          aria-controls="site-menu"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <span data-i18n="topbar.menu">เมนู</span>
        </button>

        <ul id="site-menu" class="site-menu" popover="auto">
          <li><a href="#features" data-i18n="top.features">ฟีเจอร์</a></li>
          <li><a href="#quickstart" data-i18n="top.cli">คำสั่ง CLI</a></li>
          <li><a href="#nextgen" data-i18n="top.nextgen">Wasm &amp; KVM</a></li>
          <li><a href="#desktop" data-i18n="top.desktop">Desktop</a></li>
          <li><a href="#benchmarks" data-i18n="top.benchmarks">ผลทดสอบ</a></li>
          <li><a href="#architecture" data-i18n="top.arch">สถาปัตยกรรม</a></li>
        </ul>
      </nav>

      <div class="topbar-actions">
        <button type="button" id="cmd-open-btn" class="cmd-trigger" aria-label="Quick search (Ctrl+K)" title="Quick search (Ctrl+K)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <kbd>Ctrl K</kbd>
        </button>
        <a class="nav-pill nav-gh" href="https://github.com/seashyne/Coral-Container-Project" target="_blank" rel="noopener">GitHub</a>
        <a class="nav-pill nav-cta" href="#install" data-i18n="topbar.download">ดาวน์โหลด</a>

        <button type="button" id="lang-toggle" class="icon-btn lang-trigger" popovertarget="docs-lang-popover" aria-label="Select language">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span id="lang-label">EN</span>
        </button>

        <div id="docs-lang-popover" popover="auto" class="docs-lang-popover" role="group" aria-label="Select language">
          <button type="button" class="docs-lang-opt" data-docs-lang="en" aria-pressed="false"><span>English</span><span>EN</span></button>
          <button type="button" class="docs-lang-opt" data-docs-lang="th" aria-pressed="false"><span>ไทย</span><span>TH</span></button>
          <button type="button" class="docs-lang-opt" data-docs-lang="zh" aria-pressed="false"><span>简体中文</span><span>ZH</span></button>
          <button type="button" class="docs-lang-opt" data-docs-lang="ja" aria-pressed="false"><span>日本語</span><span>JA</span></button>
          <button type="button" class="docs-lang-opt" data-docs-lang="ko" aria-pressed="false"><span>한국어</span><span>KO</span></button>
          <button type="button" class="docs-lang-opt" data-docs-lang="vi" aria-pressed="false"><span>Tiếng Việt</span><span>VI</span></button>
          <button type="button" class="docs-lang-opt" data-docs-lang="es" aria-pressed="false"><span>Español</span><span>ES</span></button>
          <button type="button" class="docs-lang-opt" data-docs-lang="de" aria-pressed="false"><span>Deutsch</span><span>DE</span></button>
        </div>

        <button type="button" id="theme-toggle" class="icon-btn theme-toggle">
          <span class="state-to-dark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <span class="sr-only" data-i18n="topbar.themeDark">เปลี่ยนเป็นธีมมืด</span>

          <span class="state-to-light">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <span class="sr-only" data-i18n="topbar.themeLight">เปลี่ยนเป็นธีมสว่าง</span>
          </span>
        </button>
      </div>
    </div>
  </header>
