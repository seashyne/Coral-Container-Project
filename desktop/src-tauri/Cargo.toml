[package]
name = "coral-desktop"
version = "2.5.0"
description = "Coral Desktop — cross-platform GUI for the Coral Container Runtime"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "coral_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
tokio-stream = "0.1"
tonic = "0.12"
coral-api = { path = "../../coral_repo/api" }
anyhow = "1"
shell-words = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
